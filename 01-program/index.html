<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f2ec">
  <title>Program</title>
  <style>
    :root{--bg:#f4f2ec;--card:#fffefa;--text:#22241f;--muted:#73766f;--line:#ddd9cf;--accent:#285e49;--salon:#285e49;--ev:#985a27;--yuzme:#286987}
    *{box-sizing:border-box}
    body{min-width:320px;margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    a{text-decoration:none;color:inherit}
    .topbar{position:sticky;top:0;z-index:20;border-bottom:1px solid var(--line);background:rgba(244,242,236,.96);backdrop-filter:blur(12px)}
    .topbar-inner{display:flex;align-items:center;gap:4px;width:min(100% - 24px,760px);min-height:56px;margin:auto;overflow-x:auto;scrollbar-width:none}
    .topbar-inner::-webkit-scrollbar{display:none}
    .nav-link{flex:0 0 auto;padding:8px 12px;border-radius:8px;color:var(--muted);font-size:.85rem;font-weight:700;white-space:nowrap}
    .nav-link:hover{color:var(--text);background:#ebe8e0}
    .nav-link.active{color:var(--accent);background:#e5eee9}
    main{width:min(100% - 24px,760px);margin:24px auto 56px}
    .week{margin-bottom:20px}
    .week:last-child{margin-bottom:0}
    .week-head{padding:0 4px 7px;color:var(--muted);font-size:.72rem;font-weight:650;letter-spacing:.02em}
    .week-body{overflow:hidden;border:1px solid var(--line);border-radius:14px;background:var(--card)}
    .day{border-bottom:1px solid #ebe8e0}
    .day:last-child{border-bottom:0}
    .day-row{display:grid;grid-template-columns:max-content max-content 1fr 34px;align-items:center;gap:10px;padding:10px 15px}
    .day-row:hover{background:#f7f5ef}
    .day-link{display:contents}
    .date{font-size:.78rem;font-weight:800;white-space:nowrap}
    .wd{color:var(--muted);font-size:.76rem;white-space:nowrap}
    .wd-short{display:none}
    .title-cell{display:flex;align-items:center;gap:7px;min-width:0}
    .code{flex:0 0 auto;padding:3px 7px;border-radius:6px;font-size:.72rem;font-weight:850;white-space:nowrap}
    .code.salon{background:#e5eee9;color:var(--salon)}
    .code.ev{background:#f4e8dc;color:var(--ev)}
    .code.yuzme{background:#e1eef3;color:var(--yuzme)}
    .title-text{font-size:.84rem;font-weight:650;line-height:1.3}
    .go-arrow{flex:0 0 auto;color:var(--muted);font-size:.85rem}
    .toggle{display:grid;place-items:center;width:28px;height:28px;margin-left:auto;border:1px solid var(--line);border-radius:7px;background:transparent;color:var(--muted);font:inherit;font-size:1rem;cursor:pointer}
    .toggle:hover{border-color:var(--accent);color:var(--accent)}
    .day.open .toggle{color:var(--text);border-color:var(--text)}
    .day-body{display:none;padding:3px 15px 16px;color:#4d514b;font-size:.84rem;line-height:1.6}
    .day.open .day-body{display:block}
    .day-body p{margin:0 0 9px}
    .day-body ul{margin:0 0 9px;padding-left:18px}
    .day-body li{margin:3px 0}
    .day-body>:last-child{margin-bottom:0}
    .kv{color:var(--text);font-weight:800}
    .progress{margin-top:12px;padding-top:11px;border-top:1px solid #ebe8e0;color:var(--muted);font-size:.79rem}
    .alt{margin-top:12px;padding-top:11px;border-top:1px solid #ebe8e0}
    .alt-label{display:block;margin-bottom:5px;color:var(--muted);font-size:.68rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
    .alt-list{display:grid}
    .alt-item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;font-size:.8rem;color:var(--muted);line-height:1.4}
    .alt-item:not(:last-child){border-bottom:1px solid #ebe8e0}
    .alt-item.primary span:first-child{color:var(--text);font-weight:700}
    .alt-chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:3px;padding:4px 9px;border-radius:7px;background:#eeece4;color:var(--text);font-size:.73rem;font-weight:800}
    .alt-chip:hover{background:#ddd9cf;color:var(--text)}
    .alt-chip.today.salon{background:#e5eee9;color:var(--salon)}
    .alt-chip.today.ev{background:#f4e8dc;color:var(--ev)}
    .alt-chip.today.yuzme{background:#e1eef3;color:var(--yuzme)}
    .alt-chip.today:hover{filter:brightness(.96)}
    @media(max-width:470px){
      main{margin-top:18px}
      .day-row{grid-template-columns:max-content max-content 1fr 30px;gap:6px;padding:9px 12px}
      .wd-long{display:none}.wd-short{display:inline}
      .date{font-size:.73rem}.wd{font-size:.71rem}.title-text{font-size:.8rem}
      .day-body{padding:3px 12px 15px}
    }
  </style>
</head>
<body>
  <header class="topbar">
    <nav class="topbar-inner">
      <a class="nav-link" href="../index.html">Ana Sayfa</a>
      <a class="nav-link active" href="../01-program/">Program</a>
      <a class="nav-link" href="../02-gunluk/">Günlük</a>
      <a class="nav-link" href="../03-antrenmanlar/">Antrenmanlar</a>
      <a class="nav-link" href="../04-egzersizler/">Egzersizler</a>
    </nav>
  </header>
  <main>
    <div id="weeks"></div>
  </main>
  <script src="../02-gunluk/gunlukverileri.js?v=20260917-s2-1"></script>
  <script>
    const AYLAR=["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
    const GUNLER=["Pazar","Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi"];
    const KISA={"Pazar":"Paz","Pazartesi":"Pzt","Salı":"Sal","Çarşamba":"Çar","Perşembe":"Per","Cuma":"Cum","Cumartesi":"Cmt"};

    const antrenmanlar={
      S1:{
        not:`<p>Salonda itiş günü. 26 Ağustos'taki son kayıtlarından devam et.</p>
          <ul>
            <li><span class="kv">Bench press:</span> her elde 10 kg</li>
            <li><span class="kv">Lateral raise:</span> her elde 7 kg</li>
            <li><span class="kv">Incline press:</span> her elde 10 kg</li>
            <li><span class="kv">Shoulder press:</span> her elde 7 kg</li>
            <li><span class="kv">Triceps extension:</span> tek dambıl 10 kg</li>
          </ul>
          <p>İlk dönüş haftasında ağırlık artırma. Sonraki S1'de bütün setler yine rahat kalırsa yalnızca bench press ve incline press ağırlığını bir kademe artır.</p>`,
        alt:[
          {kod:"E1",metin:"Salona gidemiyorsan bunu tercih et — aynı kas grubu, ekipmansız."},
          {kod:"Y2",metin:"Yüzmek istersen tempo olarak en yakın gün budur."}
        ]},
      S2:{
        not:`<p>Salonda çekiş günü. 22 Ağustos'taki son kayıtlarından devam et.</p>
          <ul>
            <li><span class="kv">Tek kol row:</span> 12,5 kg</li>
            <li><span class="kv">Reverse fly:</span> her elde 7 kg</li>
            <li><span class="kv">Pullover:</span> bilek ağrısı nedeniyle tek dambıl 10 kg ile kontrollü dene</li>
            <li><span class="kv">Biceps curl:</span> her elde 7 kg</li>
            <li><span class="kv">Hammer curl:</span> her elde 7 kg</li>
          </ul>
          <p>Pullover sırasında bilek ağrısı tekrarlarsa hareketi bırak; o gün ağırlık artırma.</p>`,
        alt:[
          {kod:"E4",metin:"Salona gidemiyorsan bunu tercih et — bant ile aynı kas grubu."},
          {kod:"Y2",metin:"Yüzmek istersen tempo olarak en yakın gün budur."}
        ]},
      S3:{
        not:`<p>Salonda bacak günü. Deadlift dışında tamamen dambılla. 21 Ağustos'taki son kayıtlarından devam et.</p>
          <ul>
            <li><span class="kv">Goblet squat:</span> tek dambıl 15 kg</li>
            <li><span class="kv">Deadlift:</span> 40 kg, 3 × 5 — dambılla aynı ağırlıkta yapılamayacak tek hareket, bunun için bir barbell gerekir</li>
            <li><span class="kv">Hip thrust:</span> tek dambıl 15 kg</li>
            <li><span class="kv">Bulgarian split squat:</span> her bacak 5 kg</li>
            <li><span class="kv">Calf raise:</span> her elde 10 kg</li>
          </ul>
          <p>Deadlift'i haftada bir kez çalıştığın için haftalık 5 kg ekle, diğerlerinde haftalık 2,5 kg. Deadlift'te 3 antrenman üst üste 5 tekrarı tamamlayamazsan %10 düş.</p>`,
        alt:[
          {kod:"E2",metin:"Salona gidemiyorsan bunu tercih et — aynı kas grubu, ekipmansız."},
          {kod:"Y1",metin:"Yüzmek istersen bacaklar için en hafif gün budur."}
        ]},
      S4:{
        not:`<p>10 günlük aradan dönüş için tam vücut çalışması. Bu antrenmanda ağırlık artırma ve her sette 2–3 tekrar daha yapabilecekmiş gibi bırak.</p>
          <ul>
            <li><span class="kv">Goblet squat:</span> tek dambıl 15 kg</li>
            <li><span class="kv">Bench press:</span> her elde 10 kg</li>
            <li><span class="kv">Tek kol row:</span> 12,5 kg</li>
            <li><span class="kv">Romanian deadlift:</span> her elde 10 kg</li>
            <li><span class="kv">Shoulder press:</span> her elde 7 kg</li>
          </ul>`,
        alt:[
          {kod:"E3",metin:"Salona gidemiyorsan bunu tercih et — aynı üç örüntü, ekipmansız."},
          {kod:"Y3",metin:"Yüzmek istersen kapsam olarak en yakın gün budur."}
        ]},
      E1:{
        not:`<p>Evde itiş günü. Ekipman gerekmez, zorluk tempodan ve varyasyondan geliyor.</p>
          <ul>
            <li><span class="kv">Normal şınav:</span> 3×10 sana hafif gelir, <b>3×18</b> yap</li>
            <li><span class="kv">Pike şınavı:</span> 3×8'de kal — omuz için en zorlayıcı hareket, sayıyı zorlama</li>
            <li><span class="kv">Dar tutuş şınav:</span> 3×12</li>
          </ul>`,
        alt:[
          {kod:"S1",metin:"Salona gidebiliyorsan bunu tercih et — aynı kas grubunu daha ağır yükle çalıştırır."},
          {kod:"Y2",metin:"Yüzmek istersen tempo olarak en yakın gün budur."}
        ]},
      E2:{
        not:`<p>Evde bacak günü. Ağırlık yok; zorluk tek bacak çalışmasından ve tempodan geliyor.</p>
          <ul>
            <li><span class="kv">Bulgarian split squat:</span> her bacak 3×10; kolaysa arka ayağını daha yükseğe koy</li>
            <li><span class="kv">Yavaş squat:</span> 3 saniyede in, altta 1 saniye bekle</li>
            <li><span class="kv">Tek bacak glute bridge:</span> tepede 2 saniye sık</li>
          </ul>`,
        alt:[
          {kod:"S3",metin:"Salona gidebiliyorsan bunu tercih et — aynı kas grubunu daha ağır yükle çalıştırır."},
          {kod:"Y1",metin:"Yüzmek istersen bacaklar için en hafif gün budur."}
        ]},
      E3:{
        not:`<p>Evde tam vücut: squat, itiş, çekiş, kalça ve core aynı antrenmanda.</p>
          <ul>
            <li><span class="kv">Normal şınav:</span> 3×15 yap, sana hafif gelir</li>
            <li><span class="kv">Bant ile row:</span> 12. tekrarda zorlanacağın kalınlığı seç</li>
            <li><span class="kv">Yavaş squat:</span> 3 saniyede in, altta 1 saniye bekle</li>
          </ul>`,
        alt:[
          {kod:"S4",metin:"Salona gidebiliyorsan bunu tercih et — aynı kas grubunu daha ağır yükle çalıştırır."},
          {kod:"Y3",metin:"Yüzmek istersen kapsam olarak en yakın gün budur."}
        ]},
      E4:{
        not:`<p>Evde çekiş günü, direnç bandıyla.</p>
          <ul>
            <li><span class="kv">Bant seçimi:</span> 12. tekrarda zorlanacağın kalınlık</li>
            <li><span class="kv">Row hareketleri:</span> direnç azsa bandı kısaltarak sertleştir</li>
            <li><span class="kv">Superman:</span> tepede 1 saniye bekle</li>
          </ul>`,
        alt:[
          {kod:"S2",metin:"Salona gidebiliyorsan bunu tercih et — aynı kas grubunu daha ağır yükle çalıştırır."},
          {kod:"Y2",metin:"Yüzmek istersen tempo olarak en yakın gün budur."}
        ]},
      Y1:{
        not:`<p>Teknik ve rahat yüzme, toplam 500 m. 400 m kesintisiz yüzebildiğin için rahat gelmeli — hızı değil kulaç uzunluğunu düşün.</p>`,
        alt:[{kod:null,metin:"Havuz kapalıysa, o hafta kullanılmayan bir ev kartını hafif tempoda yap. Kardiyoyu tam karşılamaz ama haftayı boş bırakmamış olursun."}]},
      Y2:{
        not:`<p>Kısa aralıklı yüzme, toplam 450 m. Haftanın en tempolu günü.</p>
          <p>8×25 m bölümü en zor kısmı; nefesin bir sonraki tekrara kadar toparlanmıyorsa arayı 30 saniyeden 45 saniyeye çıkar.</p>`,
        alt:[{kod:null,metin:"Havuz kapalıysa, o hafta kullanılmayan bir ev kartını hafif tempoda yap. Kardiyoyu tam karşılamaz ama haftayı boş bırakmamış olursun."}]},
      Y3:{
        not:`<p>Kesintisiz yüzme, toplam 550 m. İçindeki 300 m kesintisiz bölüm 400 m'lik kapasitenin altında, istikrarlı tempoda geçmeli.</p>`,
        alt:[{kod:null,metin:"Havuz kapalıysa, o hafta kullanılmayan bir ev kartını hafif tempoda yap. Kardiyoyu tam karşılamaz ama haftayı boş bırakmamış olursun."}]}
    };

    // 9 Eylül'de 10 günlük aradan dönüş; ardından Pazartesi ev, Çarşamba ve Cuma salon, Cumartesi havuz.
    const plan=[
      {ev:null,salonA:"S4",salonB:"S1",yuzme:"Y1"},
      {ev:"E4",salonA:"S3",salonB:"S2",yuzme:"Y2"},
      {ev:"E2",salonA:"S1",salonB:"S3",yuzme:"Y3"}
    ];
    const OFSET={ev:0,salonA:2,salonB:4,yuzme:5};
    const ILERLEME="3. hafta: Önceki antrenmanın bütün setleri kontrollü ve rahat tamamlandıysa yalnızca bir hareketin ağırlığını bir kademe artır.";

    const basla=new Date(2026,8,7);
    const kutu=document.getElementById("weeks");

    plan.forEach((hafta,hi)=>{
      const gunler=[
        {tur:"ev",kod:hafta.ev},
        {tur:"salonA",kod:hafta.salonA},
        {tur:"salonB",kod:hafta.salonB},
        {tur:"yuzme",kod:hafta.yuzme}
      ].filter(g=>g.kod).map(g=>{
        const t=new Date(basla);
        t.setDate(basla.getDate()+hi*7+OFSET[g.tur]);
        return {...g,tarih:t};
      });

      const pazartesi=gunler[0].tarih;
      const haftaEtiketi=`${pazartesi.getDate()} ${AYLAR[pazartesi.getMonth()]} haftası`;

      const satirlar=gunler.map(({tur,kod,tarih})=>{
        const k=antrenmanlar[kod];
        const yer=kod.startsWith("S")?"salon":(kod.startsWith("E")?"ev":"yuzme");
        const adi=GUNLER[tarih.getDay()];
        const baslik=ANTRENMAN_ADI[kod]||kod;
        const ek=(tur==="ev"||tur==="yuzme")&&hi>=2?`<p class="progress">${ILERLEME}</p>`:"";
        const tumAntrenmanlar=[{kod,metin:"Bugünün antrenmanı.",ana:true},...k.alt];
        const antrenmanlarHtml=tumAntrenmanlar.map(a=>{
          const chipTuru=a.kod?(a.kod.startsWith("S")?"salon":(a.kod.startsWith("E")?"ev":"yuzme")):"";
          const chip=a.kod?`<a class="alt-chip${a.ana?" today "+chipTuru:""}" href="../03-antrenmanlar/antrenman.html#${a.kod}" data-antrenman="${a.kod}">${a.kod} →</a>`:"";
          return `<div class="alt-item${a.ana?" primary":""}"><span>${a.metin}</span>${chip}</div>`;
        }).join("");
        return `<div class="day">
          <div class="day-row">
            <a class="day-link" href="../03-antrenmanlar/antrenman.html#${kod}" data-antrenman="${kod}">
              <span class="date">${tarih.getDate()} ${AYLAR[tarih.getMonth()]}</span>
              <span class="wd"><span class="wd-long">${adi}</span><span class="wd-short">${KISA[adi]}</span></span>
              <span class="title-cell">
                <span class="code ${yer}">${kod}</span>
                <span class="title-text">${baslik}</span>
                <span class="go-arrow" aria-hidden="true">→</span>
              </span>
            </a>
            <button class="toggle" type="button" aria-expanded="false" aria-label="Detayları göster">+</button>
          </div>
          <div class="day-body">${k.not}${ek}
            <div class="alt"><span class="alt-label">Antrenman seçenekleri</span><div class="alt-list">${antrenmanlarHtml}</div></div>
          </div>
        </div>`;
      }).join("");

      kutu.insertAdjacentHTML("beforeend",
        `<section class="week">
          <div class="week-head">${haftaEtiketi}</div>
          <div class="week-body">${satirlar}</div>
        </section>`);
    });

    kutu.addEventListener("click",e=>{
      const btn=e.target.closest(".toggle");
      if(!btn)return;
      const day=btn.closest(".day");
      const acik=day.classList.toggle("open");
      btn.textContent=acik?"−":"+";
      btn.setAttribute("aria-expanded",acik?"true":"false");
    });
  </script>
  <script src="../03-antrenmanlar/antrenman-penceresi.js?v=20260916-weights-1"></script>
  <script>AntrenmanPenceresi.baslat({yol:"../03-antrenmanlar/antrenman.html"});</script>
</body>
</html>
