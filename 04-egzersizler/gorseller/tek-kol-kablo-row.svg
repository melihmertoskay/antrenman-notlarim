<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="baslik aciklama">
<title id="baslik">Tek kol kablo row başlangıç ve çekiş pozisyonları</title>
<desc id="aciklama">Alt makaraya bağlı tekli tutamakla makineye dönük dengeli durulur. Kol önden uzanır, dirsek gövdenin yanından geriye çekilir. Sırt kasları renkli gösterilir.</desc>
<defs><marker id="ok" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="none" stroke="#bc6d54" stroke-width="2"/></marker></defs>
<rect width="800" height="360" rx="24" fill="#faf8f2"/>
<rect x="20" y="22" width="370" height="315" rx="18" fill="#fffefa" stroke="#ddd9cf"/>
<rect x="410" y="22" width="370" height="315" rx="18" fill="#fffefa" stroke="#ddd9cf"/>
<g font-family="Arial,sans-serif"><text x="42" y="57" font-size="20" font-weight="700" fill="#285e49">1 · Kolu uzat</text><text x="432" y="57" font-size="20" font-weight="700" fill="#285e49">2 · Dirseği geriye çek</text></g>
<path d="M40 283 H370 M430 283 H760" stroke="#abb1aa" stroke-width="4"/>
