<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4f2ec"><title>Egzersizler</title>
<style>:root{--bg:#f4f2ec;--card:#fffefa;--text:#22241f;--muted:#73766f;--line:#ddd9cf;--accent:#285e49;--soft:#e5eee9}*{box-sizing:border-box}body{min-width:320px;margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}a{text-decoration:none;color:inherit}button{font:inherit}.topbar{position:sticky;top:0;z-index:20;border-bottom:1px solid var(--line);background:rgba(244,242,236,.96)}.nav{display:flex;gap:4px;width:min(100% - 24px,760px);min-height:56px;margin:auto;align-items:center;overflow:auto}.nav a{flex:none;padding:8px 12px;border-radius:8px;color:var(--muted);font-size:.85rem;font-weight:700;white-space:nowrap}.nav a:hover{background:#ebe8e0;color:var(--text)}.nav .active{background:var(--soft);color:var(--accent)}main{width:min(100% - 24px,760px);margin:24px auto 56px}.group{margin-bottom:26px}.group-title{margin:0;padding:0 4px 8px;color:var(--muted);font-size:.74rem;letter-spacing:.04em;text-transform:uppercase}.list{border-top:1px solid var(--line)}.exercise{display:grid;grid-template-columns:46px 1fr auto;align-items:center;width:100%;min-height:55px;padding:9px 4px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--text);text-align:left;cursor:pointer}.exercise:hover{background:#eeece5}.code{color:var(--accent);font-size:.8rem;font-weight:850}.name{font-size:.9rem}.arrow{color:var(--muted)}.modal{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(24,27,23,.55)}.modal.open{display:flex}.box{width:min(100%,540px);max-height:88vh;overflow:auto;border-radius:18px;background:var(--card);box-shadow:0 24px 80px #0004}.head{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:18px 20px;border-bottom:1px solid var(--line)}h2{margin:0;font-size:1.15rem}.close{display:grid;flex:none;width:36px;height:36px;place-items:center;border:1px solid var(--line);border-radius:50%;background:none;cursor:pointer}.body{padding:20px;color:#4d514b}.image{display:block;width:100%;height:auto;margin:0 0 20px;border:1px solid var(--line);border-radius:12px}.section{margin:0 0 17px}.section h3{margin:0 0 5px;color:var(--accent);font-size:.75rem;letter-spacing:.05em;text-transform:uppercase}.section p{margin:0;line-height:1.58}.history{margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}.history h3{margin:0 0 8px;color:var(--text);font-size:.9rem}.history-item{padding:10px 0;border-top:1px solid #ebe8e0}.history-item:first-of-type{border-top:0}.history-line{font-size:.82rem}.history-note{margin:4px 0 0;color:var(--muted);font-size:.8rem}.empty{margin:0;color:var(--muted);font-size:.84rem}@media(max-width:520px){main{margin-top:18px}.exercise{grid-template-columns:42px 1fr auto}.name{font-size:.86rem}}</style></head>
<body><header class="topbar"><nav class="nav"><a href="../index.html">Ana Sayfa</a><a href="../01-program/">Program</a><a href="../02-gunluk/">Günlük</a><a href="../03-antrenmanlar/">Antrenmanlar</a><a class="active" href="../04-egzersizler/">Egzersizler</a></nav></header><main id="groups"></main>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="title"><div class="box"><div class="head"><h2 id="title"></h2><button class="close" id="close" aria-label="Kapat">×</button></div><div class="body" id="body"></div></div></div>
<script src="egzersizverileri.js?v=20260913-s1-2"></script><script src="kodlar.js"></script><script src="../02-gunluk/gunlukverileri.js?v=20260916-1"></script><script>
const BASLIKLAR={I:"Isınma",G:"Göğüs, omuz ve arka kol",S:"Sırt ve ön kol",B:"Bacak ve kalça",K:"Karın ve merkez bölge",Y:"Yüzme"};const groups=document.getElementById("groups"),modal=document.getElementById("modal"),title=document.getElementById("title"),body=document.getElementById("body");const entries=Object.entries(EGZERSIZLER).map(([name,info])=>({name,info,code:EGZERSIZ_KODLARI[name]||"D99"})).sort((a,b)=>a.code.localeCompare(b.code,undefined,{numeric:true}));Object.keys(BASLIKLAR).forEach(letter=>{const list=entries.filter(x=>x.code[0]===letter);if(!list.length)return;groups.insertAdjacentHTML("beforeend",`<section class="group"><h1 class="group-title">${BASLIKLAR[letter]}</h1><div class="list">${list.map(x=>`<button class="exercise" data-name="${gunlukKacis(x.name)}"><span class="code">${x.code}</span><span class="name">${gunlukKacis(x.name)}</span><span class="arrow">›</span></button>`).join("")}</div></section>`) });
let egzersizPenceresiAcik=false;
function openExercise(name){const info=EGZERSIZLER[name],image=EGZERSIZ_GORSELLERI[name],records=gunlukKayitlariniGetir().filter(x=>egzersizAdi(x.egzersiz)===name).sort((a,b)=>b.gun.localeCompare(a.gun));title.textContent=`${EGZERSIZ_KODLARI[name]||""} - ${name}`;body.innerHTML=`${image?`<img class="image" src="${image}" alt="${gunlukKacis(name)} hareketini ve çalışan kasları gösteren görsel">`:""}<section class="section"><h3>Nasıl yapılır?</h3><p>${info.application}</p></section><section class="section"><h3>Dikkat</h3><p>${info.attention}</p></section><section class="section"><h3>Çalışan kaslar</h3><p>${info.muscles}</p></section><section class="section"><h3>Daha kolay</h3><p>${info.easier}</p></section><section class="history"><h3>Günlük kayıtları</h3>${records.length?records.map(r=>`<article class="history-item"><div class="history-line">${gunlukTarihEtiketi(r.gun)} · ${gunlukKacis(r.antrenman)}${r.agirlik?` · ${gunlukKacis(r.agirlik)}`:""}${r.setTekrar?` · ${gunlukKacis(r.setTekrar)}`:""}</div>${r.aciklama?`<p class="history-note">${gunlukKacis(r.aciklama)}</p>`:""}</article>`).join(""):'<p class="empty">Henüz kayıt yok.</p>'}</section>`;if(!modal.classList.contains("open")){history.pushState({egzersizPenceresi:true},"",location.href);egzersizPenceresiAcik=true}modal.classList.add("open");document.getElementById("close").focus()}
groups.onclick=e=>{const b=e.target.closest(".exercise");if(b)openExercise(b.dataset.name)};function gercektenKapat(){modal.classList.remove("open");egzersizPenceresiAcik=false}
function egzersizKapat(){if(history.state&&history.state.egzersizPenceresi)history.back();else gercektenKapat()}
addEventListener("popstate",()=>{if(egzersizPenceresiAcik&&!(history.state&&history.state.egzersizPenceresi))gercektenKapat()});document.getElementById("close").onclick=egzersizKapat;modal.onclick=e=>{if(e.target===modal)egzersizKapat()};document.onkeydown=e=>{if(e.key==="Escape")egzersizKapat()};
</script></body></html>
