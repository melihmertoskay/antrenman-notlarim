<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f4f2ec">
  <title>Günlük</title>
  <style>
    :root{--bg:#f4f2ec;--card:#fffefa;--text:#22241f;--muted:#73766f;--line:#ddd9cf;--accent:#285e49;--soft:#e5eee9}
    *{box-sizing:border-box}body{min-width:320px;margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}a{text-decoration:none;color:inherit}button,input,select,textarea{font:inherit}
    .topbar{position:sticky;top:0;z-index:20;border-bottom:1px solid var(--line);background:rgba(244,242,236,.96)}.nav{display:flex;gap:4px;width:min(100% - 24px,760px);min-height:56px;margin:auto;align-items:center;overflow:auto}.nav a{flex:none;padding:8px 12px;border-radius:8px;color:var(--muted);font-size:.85rem;font-weight:700;white-space:nowrap}.nav a:hover{background:#ebe8e0;color:var(--text)}.nav .active{background:var(--soft);color:var(--accent)}
    main{width:min(100% - 24px,760px);margin:24px auto 60px}.actions{display:flex;justify-content:flex-end;margin-bottom:14px}.primary{border:0;border-radius:9px;background:var(--accent);color:#fff;padding:10px 14px;font-weight:750;cursor:pointer}.empty{padding:28px 10px;color:var(--muted);text-align:center}
    .days{display:grid;gap:18px}.day-card{overflow:hidden;border:1px solid var(--line);border-radius:18px;background:var(--card);box-shadow:0 14px 42px rgba(45,48,41,.07)}.card-header{display:flex;align-items:center;gap:15px;padding:22px 24px;border-bottom:1px solid var(--line)}.card-code{display:grid;flex:0 0 54px;width:54px;height:54px;place-items:center;border-radius:13px;background:var(--soft);color:var(--accent);font-size:1.05rem;font-weight:850}.card-header h1{margin:0 0 4px;font-size:clamp(1.28rem,4vw,1.7rem);line-height:1.15}.card-meta{margin:0;color:var(--muted);font-size:.84rem}
    .table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;table-layout:fixed}th{padding:11px 12px;background:#f6f4ee;color:var(--muted);font-size:.69rem;letter-spacing:.06em;text-align:left;text-transform:uppercase}td{padding:15px 12px;border-top:1px solid #ebe8e0;vertical-align:top;font-size:.92rem}tbody tr:first-child td{border-top:0}th:nth-child(1),td:nth-child(1){width:48px;color:var(--muted);text-align:center}th:nth-child(3),td:nth-child(3){width:135px}th:nth-child(4),td:nth-child(4){width:110px}.exercise{font-weight:680}.weight{color:#4d514b;font-size:.86rem;font-weight:650}.target{font-weight:800;white-space:nowrap}.record-actions{display:flex;gap:12px;margin-top:8px}.text-button{padding:0;border:0;background:none;color:var(--accent);font-size:.76rem;cursor:pointer}.danger{color:#9b3e34}
    .notes{padding:15px 24px;border-top:1px solid var(--line);background:#faf8f2}.notes-label{display:block;margin-bottom:5px;color:var(--accent);font-size:.73rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase}.notes p{margin:0;color:#4d514b;font-size:.87rem;line-height:1.55}.notes p+p{margin-top:6px}
    .modal{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(24,27,23,.55)}.modal.open{display:flex}.dialog{width:min(100%,520px);max-height:92vh;overflow:auto;border-radius:18px;background:var(--card);box-shadow:0 24px 80px #0004}.dialog-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line)}.dialog-head h2{margin:0;font-size:1.15rem}.close{display:grid;width:36px;height:36px;place-items:center;border:1px solid var(--line);border-radius:50%;background:none;cursor:pointer}.form{display:grid;gap:14px;padding:20px}.field{display:grid;gap:6px}.field label{font-size:.78rem;font-weight:750}.field input,.field select,.field textarea{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--text)}.field textarea{min-height:92px;resize:vertical}.form-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:4px}.secondary{padding:9px 13px;border:1px solid var(--line);border-radius:9px;background:none;cursor:pointer}
    @media(max-width:560px){main{margin-top:17px}.card-header{padding:18px}th{padding:9px 6px;font-size:.6rem}td{padding:14px 6px;font-size:.82rem}th:nth-child(1),td:nth-child(1){width:30px}th:nth-child(3),td:nth-child(3){width:96px}th:nth-child(4),td:nth-child(4){width:75px}.weight{font-size:.76rem}.target{white-space:normal}.notes{padding:13px 18px}}
  </style>
</head>
<body>
  <header class="topbar"><nav class="nav"><a href="../index.html">Ana Sayfa</a><a href="../01-program/">Program</a><a class="active" href="../02-gunluk/">Günlük</a><a href="../03-antrenmanlar/">Antrenmanlar</a><a href="../04-egzersizler/">Egzersizler</a></nav></header>
  <main><div class="actions"><button class="primary" id="add">+ Kayıt ekle</button></div><div class="days" id="days"></div></main>
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="dialog"><div class="dialog-head"><h2 id="modalTitle">Kayıt ekle</h2><button class="close" type="button" id="close" aria-label="Kapat">×</button></div><form class="form" id="form"><input type="hidden" id="recordId"><div class="field"><label for="date">Gün</label><input id="date" type="date" required></div><div class="field"><label for="antrenman">Antrenman kartı</label><select id="antrenman" required></select></div><div class="field"><label for="exercise">Egzersiz</label><select id="exercise" required></select></div><div class="field"><label for="weight">Ağırlık</label><input id="weight" placeholder="Örn. 10 kg veya vücut ağırlığı"></div><div class="field"><label for="sets">Set ve tekrar</label><input id="sets" placeholder="Örn. 3 × 10"></div><div class="field"><label for="note">Not</label><textarea id="note" placeholder="Antrenmanla ilgili notun"></textarea></div><div class="form-actions"><button class="secondary" type="button" id="cancel">Vazgeç</button><button class="primary" type="submit">Kaydet</button></div></form></div></div>
  <script src="gunlukverileri.js"></script><script src="../04-egzersizler/egzersizverileri.js"></script><script src="../04-egzersizler/kodlar.js"></script>
  <script>
    const $=id=>document.getElementById(id),days=$("days"),modal=$("modal"),form=$("form");
    function doldur(){
      $("antrenman").innerHTML=Object.entries(ANTRENMAN_ADI).map(([k,a])=>`<option value="${k}">${k} - ${a}</option>`).join("");
      $("exercise").innerHTML=Object.keys(EGZERSIZLER).sort((a,b)=>(EGZERSIZ_KODLARI[a]||"Z").localeCompare(EGZERSIZ_KODLARI[b]||"Z",undefined,{numeric:true})).map(a=>`<option value="${gunlukKacis(a)}">${EGZERSIZ_KODLARI[a]||"–"} - ${gunlukKacis(a)}</option>`).join("");
    }
    function render(){
      const liste=gunlukKayitlariniGetir().sort((a,b)=>b.gun.localeCompare(a.gun));
      const gruplar=liste.reduce((o,x)=>((o[x.gun]||=[]).push(x),o),{});
      const gunler=Object.keys(gruplar).sort().reverse();
      if(!gunler.length){days.innerHTML='<p class="empty">Henüz günlük kaydı yok.</p>';return}
      days.innerHTML=gunler.map(gun=>{
        const kayitlar=gruplar[gun],kodlar=[...new Set(kayitlar.map(x=>x.antrenman))],notlar=[...new Set(kayitlar.map(x=>x.aciklama).filter(Boolean))];
        const baslik=kodlar.length===1?kodlar[0]:"G";
        const meta=kodlar.map(k=>`${k} · ${ANTRENMAN_ADI[k]||""}`).join(" · ");
        return `<article class="day-card"><header class="card-header"><div class="card-code">${gunlukKacis(baslik)}</div><div><h1>${gunlukTarihEtiketi(gun)}</h1><p class="card-meta">${gunlukKacis(meta)}</p></div></header><div class="table-wrap"><table><thead><tr><th>Sıra</th><th>Hareket</th><th>Ağırlık</th><th>Tekrar</th></tr></thead><tbody>${kayitlar.map((k,i)=>`<tr><td>${i+1}</td><td><div class="exercise">${gunlukKacis(egzersizAdi(k.egzersiz))}</div><div class="record-actions"><button class="text-button edit" data-id="${gunlukKacis(k.id)}">Düzenle</button><button class="text-button danger delete" data-id="${gunlukKacis(k.id)}">Sil</button></div></td><td class="weight">${gunlukKacis(k.agirlik||"—")}</td><td class="target">${gunlukKacis(k.setTekrar||"—")}</td></tr>`).join("")}</tbody></table></div>${notlar.length?`<div class="notes"><span class="notes-label">Notlar</span>${notlar.map(n=>`<p>${gunlukKacis(n)}</p>`).join("")}</div>`:""}</article>`;
      }).join("");
    }
    let gunlukPenceresiAcik=false;
    function gunlukFormAc(record){
      $("modalTitle").textContent=record?"Kaydı düzenle":"Kayıt ekle";$("recordId").value=record?.id||"";$("date").value=record?.gun||new Date().toISOString().slice(0,10);$("antrenman").value=record?.antrenman||"S1";$("exercise").value=record?egzersizAdi(record.egzersiz):Object.keys(EGZERSIZLER)[0];$("weight").value=record?.agirlik||"";$("sets").value=record?.setTekrar||"";$("note").value=record?.aciklama||"";
      if(!modal.classList.contains("open")){history.pushState({gunlukPenceresi:true},"",location.href);gunlukPenceresiAcik=true}modal.classList.add("open");$("date").focus();
    }
    function gercektenKapat(){modal.classList.remove("open");gunlukPenceresiAcik=false}
    function gunlukFormKapat(){if(history.state&&history.state.gunlukPenceresi)history.back();else gercektenKapat()}
    addEventListener("popstate",()=>{if(gunlukPenceresiAcik&&!(history.state&&history.state.gunlukPenceresi))gercektenKapat()});
    $("add").onclick=()=>gunlukFormAc();$("close").onclick=gunlukFormKapat;$("cancel").onclick=gunlukFormKapat;modal.onclick=e=>{if(e.target===modal)gunlukFormKapat()};document.onkeydown=e=>{if(e.key==="Escape"&&modal.classList.contains("open"))gunlukFormKapat()};
    form.onsubmit=e=>{e.preventDefault();const veri={gun:$("date").value,antrenman:$("antrenman").value,egzersiz:$("exercise").value,agirlik:$("weight").value.trim(),setTekrar:$("sets").value.trim(),aciklama:$("note").value.trim()},id=$("recordId").value;if(id)gunlukKaydiGuncelle(id,veri);else gunlukKaydiEkle(veri);gunlukFormKapat();render()};
    days.onclick=e=>{const duzenle=e.target.closest(".edit"),sil=e.target.closest(".delete");if(duzenle)gunlukFormAc(gunlukKayitlariniGetir().find(x=>x.id===duzenle.dataset.id));if(sil&&confirm("Bu günlük kaydı silinsin mi?")){gunlukKaydiSil(sil.dataset.id);render()}};
    doldur();render();
  </script>
</body>
</html>
