<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f2ec">
  <title>Antrenman Notlarım taşındı</title>
  <style>
    :root { font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #22241f; background: #f4f2ec; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 480px); padding: 32px; border: 1px solid #ddd9cf; border-radius: 18px; background: #fffefa; box-shadow: 0 10px 34px #2d30290d; }
    h1 { margin: 0 0 12px; font-family: Georgia, serif; font-size: clamp(1.6rem, 6vw, 2rem); font-weight: 500; }
    p { margin: 0 0 24px; color: #565b54; line-height: 1.55; }
    .go { display: block; padding: 14px 18px; border-radius: 10px; background: #285e49; color: white; text-align: center; font-weight: 650; text-decoration: none; }
    .go:hover { background: #214d3c; }
    #backup { display: none; margin: 20px auto 0; padding: 0; border: 0; background: none; color: #58625a; text-decoration: underline; cursor: pointer; font: inherit; font-size: .85rem; }
  </style>
</head>
<body>
  <main>
    <h1>Antrenman Notlarım taşındı</h1>
    <p>Program, günlük, antrenmanlar ve egzersizler artık yeni adreste.</p>
    <a class="go" href="https://antrenman-notlarim.melihmertoskay.chatgpt.site/">Yeni siteye git →</a>
    <button id="backup" type="button">Bu tarayıcıdaki günlük yedeğini indir</button>
  </main>
  <script>
    const anahtar = "antrenman-notlarim-gunluk-v1";
    const kayit = localStorage.getItem(anahtar);
    const yedek = document.getElementById("backup");
    if (kayit) yedek.style.display = "block";
    yedek.addEventListener("click", () => {
      const dosya = new Blob([kayit], { type: "application/json" });
      const adres = URL.createObjectURL(dosya);
      const baglanti = document.createElement("a");
      baglanti.href = adres;
      baglanti.download = "antrenman-gunluk-yedegi.json";
      baglanti.click();
      setTimeout(() => URL.revokeObjectURL(adres), 1000);
    });
  </script>
</body>
</html>
